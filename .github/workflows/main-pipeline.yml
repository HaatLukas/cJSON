name: cJSON C-Project Build

on:
  push:
    branches:
      - ino_dev

jobs:
  build-and-compile:
    runs-on: ubuntu-latest

    steps:
      - name: Pobranie kodu
        uses: actions/checkout@v4

      - name: CMake
        run: |
          mkdir build
          cd build
          cmake ..

      - name: Kompilacja kodu (Make)
        run: |
          cd build
          make

      - name: Zapisanie gotowej biblioteki (Artefakt)
        uses: actions/upload-artifact@v4
        with:
          name: cjson-skompilowana-biblioteka
          path: build/
          retention-days: 5
